<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VFX Harness</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
    <style>
      .vfx-panel {
        position: fixed; top: 12px; left: 12px; width: 230px; padding: 10px; pointer-events: auto;
        background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
        font: 12px/1.4 'JetBrains Mono', ui-monospace, monospace; color: var(--ink);
      }
      .vfx-panel h1 { font: 700 15px/1.2 system-ui, sans-serif; margin: 0 0 8px; letter-spacing: 0.04em; }
      .vfx-panel button {
        display: block; width: 100%; margin: 3px 0; padding: 6px 8px; text-align: left; cursor: pointer;
        font: inherit; color: var(--ink); background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 4px;
      }
      .vfx-panel button:hover { background: rgba(255,255,255,0.12); }
      .vfx-panel button[aria-pressed="true"] { background: rgba(224,69,43,0.35); border-color: rgba(224,69,43,0.7); }
      .vfx-panel label { display: block; margin-top: 6px; color: var(--dim); }
      .vfx-panel input[type=range] { width: 100%; }
      .vfx-stats { position: fixed; right: 12px; top: 12px; white-space: pre; pointer-events: none;
        font: 11px/1.45 'JetBrains Mono', ui-monospace, monospace; color: var(--dim); text-align: right; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/harness/vfx.ts"></script>
  </body>
</html>
