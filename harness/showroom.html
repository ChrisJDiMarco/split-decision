<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Kit Showroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #e9ecef; --dim: #8b929a; --line: rgba(255,255,255,0.12); --accent: #ffb020; }
      html, body { margin: 0; height: 100%; background: #07080a; overflow: hidden; color: var(--ink); font-family: 'Barlow Condensed', sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #ui { position: fixed; left: 20px; top: 18px; display: flex; flex-direction: column; gap: 10px; max-width: 440px; }
      .title { font-weight: 800; font-size: 30px; letter-spacing: 0.04em; line-height: 1; }
      .title small { display: block; font-weight: 500; font-size: 14px; color: var(--dim); letter-spacing: 0.08em; margin-top: 4px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .label { font-size: 12px; letter-spacing: 0.16em; color: var(--dim); width: 72px; }
      button { font: 700 14px 'Barlow Condensed', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: rgba(20,22,26,0.72); border: 1px solid var(--line); padding: 6px 11px; cursor: pointer; backdrop-filter: blur(6px); }
      button:hover { border-color: rgba(255,255,255,0.35); }
      button.on { border-color: var(--accent); color: var(--accent); }
      button.act { border-color: rgba(255,90,60,0.6); }
      input[type=range] { width: 150px; accent-color: var(--accent); }
      #stats { position: fixed; right: 18px; bottom: 14px; font: 12px 'JetBrains Mono', monospace; color: var(--dim); text-align: right; white-space: pre; }
      #tag { position: fixed; right: 22px; top: 18px; text-align: right; }
      #tag .n { font-weight: 800; font-size: 54px; line-height: 0.9; letter-spacing: 0.02em; }
      #tag .t { font-size: 15px; color: var(--dim); max-width: 360px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <div id="tag"></div>
    <div id="stats"></div>
    <script type="module" src="/src/harness/showroom.ts"></script>
  </body>
</html>
