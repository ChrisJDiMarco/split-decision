<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #e9ecef; --dim: #8b929a; --line: rgba(255,255,255,0.12); --accent: #ffb020; --panel: rgba(14,16,19,0.82); }
      html, body { margin: 0; height: 100%; background: #07080a; overflow: hidden; color: var(--ink); font-family: 'Barlow Condensed', sans-serif; }
      canvas#c { display: block; width: 100vw; height: 100vh; }
      #ui { position: fixed; left: 16px; top: 14px; display: flex; flex-direction: column; gap: 8px; width: 330px; max-height: calc(100vh - 150px); }
      .title { font-weight: 800; font-size: 26px; letter-spacing: 0.04em; line-height: 1; }
      .title small { display: block; font-weight: 500; font-size: 13px; color: var(--dim); letter-spacing: 0.08em; margin-top: 3px; }
      .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
      .label { font-size: 11px; letter-spacing: 0.16em; color: var(--dim); width: 52px; }
      button, select { font: 700 13px 'Barlow Condensed', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 5px 9px; cursor: pointer; }
      select { text-transform: none; letter-spacing: 0.02em; font-weight: 500; font-size: 14px; }
      button:hover { border-color: rgba(255,255,255,0.35); }
      button.on { border-color: var(--accent); color: var(--accent); }
      input[type=range] { width: 170px; accent-color: var(--accent); }
      #moves { flex: 1; min-height: 120px; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); font: 12px 'JetBrains Mono', monospace; }
      #moves div { padding: 3px 8px; cursor: pointer; white-space: nowrap; color: var(--dim); }
      #moves div:hover { color: var(--ink); background: rgba(255,255,255,0.05); }
      #moves div.sel { color: #07080a; background: var(--accent); }
      #moves .grp { color: var(--ink); font-weight: 600; cursor: default; background: rgba(255,255,255,0.04); }
      #info { position: fixed; right: 16px; top: 14px; width: 380px; font: 12px/1.45 'JetBrains Mono', monospace; color: var(--dim); white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; }
      #info b { color: var(--ink); font-weight: 600; }
      #timeline { position: fixed; left: 16px; right: 16px; bottom: 12px; height: 118px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
      #timeline canvas { width: 100%; height: 100%; display: block; }
      #status { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); font: 12px 'JetBrains Mono', monospace; color: var(--dim); }
      /* Polish A/B (mode=compare): measured numbers per playback, the best of each row highlighted. */
      #info table.metrics { border-collapse: collapse; margin: 6px 0 8px; width: 100%; }
      #info table.metrics td { padding: 1px 4px; white-space: nowrap; }
      #info table.metrics td:not(:first-child) { text-align: right; color: var(--ink); }
      #info table.metrics tr:first-child td { border-bottom: 1px solid var(--line); }
      #info table.metrics td.best { color: #4fe08a; font-weight: 600; }
      #info .warn { color: #ff6a5c; }
      @media (max-width: 900px) { #info { width: auto; left: 16px; top: auto; bottom: 140px; max-height: 40vh; overflow: auto; } #ui { width: auto; right: 16px; } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <div id="info"></div>
    <div id="timeline"><canvas id="tl"></canvas></div>
    <div id="status"></div>
    <script type="module" src="/src/harness/motions.ts"></script>
  </body>
</html>
